name: Figure and analytical validation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12.14'

      - name: Install pinned dependencies
        run: python -m pip install -r requirements-ci.txt

      - name: Run build-validation regression tests
        run: python -m unittest discover -s tests -v

      - name: Regenerate and validate the Python overview
        run: python scripts/reproduce.py --python

      - name: Verify the exact scalar analytical benchmark
        run: python scripts/scalar_frontier.py verify
